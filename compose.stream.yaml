services:
  livekit:
    depends_on:
      livekit-redis:
        condition: service_healthy
  livekit-redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - livekit-stream-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10
  livekit-egress:
    image: livekit/egress:v1.15.0
    restart: unless-stopped
    depends_on:
      livekit-redis:
        condition: service_healthy
    environment:
      EGRESS_CONFIG_FILE: /run/livekit/egress.yaml
    volumes:
      - ./secrets/livekit-egress.yaml:/run/livekit/egress.yaml:ro
    shm_size: 1gb
    # LiveKit's bundled Chromium requires this capability in Docker.
    cap_add:
      - SYS_ADMIN
    cpus: 4
    mem_limit: 4g

volumes:
  livekit-stream-redis:
