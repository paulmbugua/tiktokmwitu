name: Flutter mobile

on:
  push:
    branches: [main]
    paths: ['apps/mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['apps/mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iphone:
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build ios --simulator
      - uses: actions/upload-artifact@v4
        with:
          name: mwitu-ios-simulator
          path: apps/mobile/build/ios/iphonesimulator/Runner.app
      - run: flutter build ios --release --no-codesign
