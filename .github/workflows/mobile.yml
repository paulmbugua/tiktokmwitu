name: Flutter mobile

on:
  push:
    branches: [main]
    paths: ['apps/mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['apps/mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - name: Install Android build tools
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          test -f "$ANDROID_HOME/ndk/28.2.13676358/source.properties"
      - run: flutter pub get
      - run: flutter build apk --release
        env:
          MWITU_UNSIGNED_CI: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: mwitu-android-unsigned
          path: apps/mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
      - name: Enable emulator acceleration
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test launch and LIVE link
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          working-directory: apps/mobile
          script: |
            keytool -genkeypair -keystore "$RUNNER_TEMP/mwitu-emulator.jks" -storepass android -keypass android -alias ci -keyalg RSA -validity 1 -dname CN=MwituCI
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/mwitu-emulator.jks" --ks-pass pass:android --out "$RUNNER_TEMP/mwitu-emulator.apk" build/app/outputs/flutter-apk/app-release.apk
            adb install "$RUNNER_TEMP/mwitu-emulator.apk"
            adb shell am start -W -n ke.co.tiktokmwitu.mwitu/.MainActivity
            adb shell am start -W -a android.intent.action.VIEW -d 'mwitu://open/join/000000' -p ke.co.tiktokmwitu.mwitu
            sleep 8
            adb shell pidof ke.co.tiktokmwitu.mwitu
  iphone:
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build ios --simulator
      - uses: actions/upload-artifact@v4
        with:
          name: mwitu-ios-simulator
          path: apps/mobile/build/ios/iphonesimulator/Runner.app
      - run: flutter build ios --release --no-codesign
