name: Flutter mobile

on:
  push:
    branches: [main]
    paths: ['apps/mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['apps/mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - run: sdkmanager 'platforms;android-36' 'ndk;29.0.13113456'
      - run: flutter pub get
      - run: flutter build apk --release
        env:
          MWITU_UNSIGNED_CI: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: mwitu-android-unsigned
          path: apps/mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
  iphone:
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build ios --simulator
      - uses: actions/upload-artifact@v4
        with:
          name: mwitu-ios-simulator
          path: apps/mobile/build/ios/iphonesimulator/Runner.app
      - run: flutter build ios --release --no-codesign
