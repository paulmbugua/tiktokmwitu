
name: tiktokmwitu
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mwitu
      POSTGRES_DB: mwitu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mwitu -d mwitu"]
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      PGHOST: db
      PGDATABASE: mwitu
      PGUSER: mwitu
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8092}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      TRUST_PROXY_HOPS: 1
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_INTERNAL_URL: ${LIVEKIT_INTERNAL_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      R2_MEDIA_ORIGIN: ${R2_MEDIA_ORIGIN:-}
      MEDIA_STORAGE_SECRET: ${MEDIA_STORAGE_SECRET:-}
      PAYMENT_API_ORIGIN: ${PAYMENT_API_ORIGIN:-}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_WEBHOOK_SECRET: ${PAYSTACK_WEBHOOK_SECRET:-}
      MPESA_ENV: ${MPESA_ENV:-sandbox}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-}
      MPESA_TRANSACTION_TYPE: ${MPESA_TRANSACTION_TYPE:-CustomerPayBillOnline}
      GIFTS_ALLOW_TEST_PAYMENTS: ${GIFTS_ALLOW_TEST_PAYMENTS:-false}
    volumes:
      - media:/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 10
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
  edge:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${EDGE_PORT:-8092}:80"
    volumes:
      - ./deploy/Caddyfile.local:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  database:
  media:
