
services:
  edge:
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      MWITU_DOMAIN: ${MWITU_DOMAIN:?Set the production domain}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
